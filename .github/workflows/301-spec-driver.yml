name: 160 LM301A spec driver targeted comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/301-spec-driver.yml
      - circuit/measure_301_spec_driver.py
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        test: ['response', '0', '10', '20', '30', '40', 'max']
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice python3-numpy
          curl -fL --retry 3 https://www.ti.com/lit/zip/sloj053 -o ti.zip
          curl -fL --retry 3 https://thatcorp.com/wp-content/uploads/2020/11/THATMacroModels-Rev05.zip -o that.zip
          unzip -jo ti.zip RC4558.301 -d circuit
          unzip -jo that.zip 2181_Macro_01.lib 4301_Macro_01.lib -d circuit
          cd circuit
          python3 generate_supply.py --quiet
          TEST='${{ matrix.test }}' FREQ=100 TARGET_GR='${{ matrix.test }}' python3 measure_301_spec_driver.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 301-spec-${{ matrix.test }}
          path: |
            circuit/limiting_plus4/summary.csv
            circuit/limiting_plus4/all_trials.csv
            circuit/driver_spec_results/
