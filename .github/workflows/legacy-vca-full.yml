name: 160 full circuit vintage VCA comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/legacy-vca-full.yml
      - circuit/legacy_vca/full_circuit.py
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        cell: ['200', '202C']
        freq: ['100', '1000']
        gr: ['max']
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice python3-numpy
          curl -fL --retry 3 https://www.ti.com/lit/zip/sloj053 -o ti.zip
          curl -fL --retry 3 https://thatcorp.com/wp-content/uploads/2020/11/THATMacroModels-Rev05.zip -o that.zip
          unzip -jo ti.zip RC4558.301 -d circuit
          unzip -jo that.zip 2181_Macro_01.lib 4301_Macro_01.lib -d circuit
          cd circuit
          python3 generate_supply.py --quiet
          python3 legacy_vca/prepare_models.py
          CELL='${{ matrix.cell }}' FREQ='${{ matrix.freq }}' TARGET_GR='${{ matrix.gr }}' python3 legacy_vca/full_circuit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-full-${{ matrix.cell }}-${{ matrix.freq }}-${{ matrix.gr }}
          path: |
            circuit/limiting_plus4/
            circuit/legacy_vca/full_results/
