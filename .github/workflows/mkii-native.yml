name: 160 MKII native solver qualification

on:
  push:
    branches: [160-mkii-native]
  workflow_dispatch:

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Obtain the circuit's manufacturer models
        shell: pwsh
        run: |
          curl.exe -fL --retry 3 https://www.ti.com/lit/zip/sloj053 -o ti.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          curl.exe -fL --retry 3 https://thatcorp.com/wp-content/uploads/2020/11/THATMacroModels-Rev05.zip -o that.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python mkii/prepare_models.py staging/Circuit ti.zip that.zip
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ngspice
      - name: Compile the reference fixture and native solver
        shell: msys2 {0}
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 mkii/SpiceWorker.cpp -lngspice -o staging/Circuit/reference.exe
          cp /ucrt64/lib/ngspice/spice2poly.cm staging/Circuit/
          python mkii/native/prepare.py staging/Circuit/reference.exe staging/Circuit staging/generated/Deck.hpp
          g++ -std=c++20 -O3 -march=x86-64-v3 -fno-math-errno -pthread -I staging/generated mkii/native/Probe.cpp -o staging/native.exe
          if objdump -p staging/native.exe | grep -i 'DLL Name:.*ngspice'; then exit 1; fi
      - name: Measure parity at 1 kHz
        shell: msys2 {0}
        run: |
          set -euo pipefail
          staging/native.exe --capture > staging/native-1kHz.dat
          python mkii/verify_stream.py staging/Circuit/reference.exe staging/Circuit staging/native-parity.json staging/native-1kHz.dat
      - name: Check the 128-sample callback budget
        shell: msys2 {0}
        run: staging/native.exe --gate
