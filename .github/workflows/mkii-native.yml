name: 160 MKII native real-time Windows VST3

on:
  push:
    branches: [160-mkii-cymbal]
  workflow_dispatch:

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Obtain the circuit's manufacturer models
        shell: pwsh
        run: |
          curl.exe -fL --retry 3 https://www.ti.com/lit/zip/sloj053 -o ti.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          curl.exe -fL --retry 3 https://thatcorp.com/wp-content/uploads/2020/11/THATMacroModels-Rev05.zip -o that.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python mkii/prepare_models.py staging/Circuit ti.zip that.zip
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ngspice
      - name: Compile the reference fixture and native solver
        shell: msys2 {0}
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 mkii/SpiceWorker.cpp -lngspice -o staging/Circuit/reference.exe
          cp /ucrt64/lib/ngspice/spice2poly.cm staging/Circuit/
          python mkii/native/prepare.py staging/Circuit/reference.exe staging/Circuit staging/generated/Deck.hpp
          mkdir -p staging/schedule
          g++ -std=c++20 -O3 -march=x86-64-v3 -fno-math-errno -I staging/generated mkii/native/GenerateSolve.cpp -o staging/generate-solve.exe
          staging/generate-solve.exe staging/schedule/GeneratedSolve.hpp
          g++ -std=c++20 -O3 -march=x86-64-v3 -fno-math-errno -pthread -I staging/generated -I staging/schedule mkii/native/Probe.cpp -o staging/native.exe
          mkdir -p staging/runtime
          g++ -std=c++20 -O3 -march=x86-64-v3 -fno-math-errno -pthread -shared -static \
              -I staging/generated -I staging/schedule mkii/native/Runtime.cpp -o staging/runtime/160-native.dll
          objdump -p staging/runtime/160-native.dll | grep 'DLL Name:'
          if objdump -p staging/runtime/160-native.dll | grep -Ei 'DLL Name:.*(ngspice|libstdc|libgcc|winpthread)'; then exit 1; fi
          if objdump -p staging/native.exe | grep -i 'DLL Name:.*ngspice'; then exit 1; fi
      - name: Measure parity at 1 kHz
        shell: msys2 {0}
        run: |
          set -euo pipefail
          staging/native.exe --capture > staging/native-1kHz.dat
          python mkii/verify_stream.py staging/Circuit/reference.exe staging/Circuit staging/native-parity.json staging/native-1kHz.dat
      - name: Record native solver timing and paced playback
        continue-on-error: true
        shell: msys2 {0}
        run: |
          set -euo pipefail
          staging/native.exe | tee staging/native-compute.txt
          staging/native.exe --playback | tee staging/native-playback.txt
      - uses: actions/cache/restore@v4
        with:
          path: build-native
          key: native-msvc-v1-${{ github.sha }}
          restore-keys: native-msvc-v1-
      - name: Build Windows VST3 and test host
        shell: pwsh
        run: |
          cmake -S mkii -B build-native -A x64 -DMKII_NATIVE_RUNTIME=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-native --config Release --target Circuit160_VST3 Vst3Smoke --parallel 4
      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: build-native
          key: native-msvc-v1-${{ github.sha }}
      - name: Verify normal VST3 playback and package the bundle
        shell: pwsh
        run: |
          $vst = (Resolve-Path "build-native/Circuit160_artefacts/Release/VST3/160 MKII.vst3").Path
          $resources = Join-Path $vst "Contents/Resources/Native"
          New-Item -ItemType Directory -Force $resources | Out-Null
          Copy-Item "staging/runtime/160-native.dll" $resources
          $hostTest = (Resolve-Path "build-native/Vst3Smoke_artefacts/Release/Vst3Smoke.exe").Path
          $test = Start-Process -FilePath $hostTest -ArgumentList "`"$vst`"" -NoNewWindow -PassThru -Wait -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke-out.txt,smoke-err.txt
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $vst release -Recurse
          Copy-Item staging/native-parity.json,smoke-out.txt,mkii/native/README.md,160-MKII-faceplate.png release
      - uses: actions/upload-artifact@v4
        with:
          name: 160-MKII-0.1-Windows-x64-VST3-Native-160VU-Faceplate
          path: release
          if-no-files-found: error
