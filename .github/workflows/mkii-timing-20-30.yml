name: MKII 20 and 30 dB GR timing
on:
  push:
    branches: [measurement-20-30db]
    paths:
      - .github/workflows/mkii-timing-20-30.yml
jobs:
  timing:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: gr20, target: 20}
          - {label: gr30, target: 30}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice python3-numpy
          curl -fL --retry 3 https://www.ti.com/lit/zip/sloj053 -o ti.zip
          curl -fL --retry 3 https://thatcorp.com/wp-content/uploads/2020/11/THATMacroModels-Rev05.zip -o that.zip
          unzip -jo ti.zip RC4558.301 -d circuit
          unzip -jo that.zip 2181_Macro_01.lib 4301_Macro_01.lib -d circuit
          cd circuit
          python3 generate_supply.py --quiet
          TARGET=${{ matrix.target }} python3 - <<'PY'
          import numpy as np, pathlib, subprocess, re, os
          target=float(os.environ['TARGET'])
          print('TARGET GR',target,flush=True)
          assert 'RT=909k CTVAL=22u' in pathlib.Path('modern_blackmer_cells.inc').read_text()
          from concurrent.futures import ThreadPoolExecutor
          base=pathlib.Path('160_retrofit.cir').read_text().rsplit('.end',1)[0]
          out=pathlib.Path('timing');out.mkdir(exist_ok=True)
          def run(name,th):
              s=re.sub(r'THRESHV=[^ ]+',f'THRESHV={th}',base)
              for n,node,sgn in [('VINP','IN_PLUS',1),('VINM','IN_MINUS',-1)]:
                  s=re.sub(r'^'+n+r' .*$',f'B{n} {node} 0 V={sgn*.5}*v(amp)*sin(2*pi*1000*time)',s,flags=re.M)
              s+='\nVAMP amp 0 PWL(0 .001 1 .001 1.000001 1 2 1 2.000001 .001 3 .001)\n'
              p=out/(name+'.cir');raw=out/(name+'.tsv')
              p.write_text(s+f'\n.control\nset wr_singlescale\nset wr_vecnames\ntran 5u 3 0 5u\nwrdata {raw} v(out_plus) v(ec_minus) v(amp)\nquit\n.endc\n.end\n')
              with (out/(name+'.log')).open('w') as l:subprocess.run(['ngspice','-b',str(p)],stdout=l,stderr=subprocess.STDOUT,check=True)
              a=np.loadtxt(raw,skiprows=1);assert a[-1,0]>2.999
              t=np.arange(0,3,1e-5);y=np.interp(t,a[:,0],a[:,1]).reshape(-1,100); tt=t.reshape(-1,100)[:,0]+.0005
              ph=2*np.pi*np.arange(100)/100
              mag=2*np.hypot(y@np.cos(ph),y@np.sin(ph))/100
              amp=np.where((tt>1)&(tt<2),1,.001)
              gain=20*np.log10(np.maximum(mag/amp,1e-20))
              lo=np.median(gain[(tt>.85)&(tt<.99)]); hi=np.median(gain[(tt>1.85)&(tt<1.99)])
              gr=lo-hi
              plateau=gain[(tt>1.75)&(tt<1.99)]
              drift=float(np.ptp(plateau))
              print('PLATEAU variation_dB',drift,flush=True)
              print(name,'threshold',th,'settled_GR',gr,flush=True)
              np.savetxt(out/(name+'_envelope.csv'),np.c_[tt,lo-gain],delimiter=',',header='seconds,GR_dB')
              return gr,tt,lo-gain,drift
          lo_th,hi_th=.0001,.4
          th=.70710678*10**(-target/15)
          history=[]
          for i in range(16):
              gr,t,y,drift=run('trial'+str(i),th)
              history.append((th,gr))
              if abs(gr-target)<=.05 and drift<=.02:break
              if gr>target:lo_th=th
              else:hi_th=th
              # Use monotonic threshold sensitivity in dB, or bracket fallback.
              candidate=th*10**((gr-target)/15)
              th=candidate if lo_th<candidate<hi_th else (lo_th*hi_th)**.5
          if abs(gr-target)>.05 or drift>.02:raise SystemExit('Target settled plateau not validated')
          def cross(start,end,target,up):
              ix=np.where((t>=start)&(t<end)&((y>=target) if up else (y<=target)))[0]
              return float((t[ix[0]]-start)*1000) if len(ix) else float('nan')
          mask=(t>2.005)&(y>.2*gr)&(y<.8*gr)
          print('RECOVERY slope_dB_per_s',-np.polyfit(t[mask],y[mask],1)[0],flush=True)
          print('FINAL actual_GR_dB',gr,'threshold_Vrms',history[-1][0],'plateau_variation_dB',drift,'attack_63_percent_ms',cross(1.001,2,.632*gr,True)+1,'release_63_percent_ms',cross(2.001,3,.368*gr,False)+1,'release_to_0.1dB_ms',cross(2.001,3,.1,False)+1,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-${{ matrix.label }}
          path: circuit/timing/
