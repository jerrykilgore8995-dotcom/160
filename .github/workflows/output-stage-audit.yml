name: Output transistor audit
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/output-stage-audit.yml
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        load: [600, 10000, 100000]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice python3-numpy
          curl -fL --retry 3 https://www.ti.com/lit/zip/sloj053 -o ti.zip
          unzip -jo ti.zip RC4558.301 -d circuit
          cd circuit
          python3 generate_supply.py --quiet
          LOAD=${{ matrix.load }} python3 - <<'PY'
          import pathlib, subprocess, numpy as np, os, re, csv
          root=pathlib.Path('.')
          out=pathlib.Path('output_audit');out.mkdir(exist_ok=True)
          base=(root/'160_retrofit.cir').read_text()
          stage=base[base.index('C21 AUDIO_OUT'):].rsplit('.end',1)[0]
          stage=re.sub(r'RLOAD OUT_PLUS 0 \S+',f'RLOAD OUT_PLUS 0 {os.environ["LOAD"]}',stage)
          stage=stage.replace('QP VP24 BASEP EP BC341','VCP VP24 CP 0\nQP CP BASEP EP BC341').replace('QN VN24 BASEN EN BC361','VCN VN24 CN 0\nQN CN BASEN EN BC361')
          prefix="""Output stage audit from current retrofit
          .include RC4558.301
          .include supply_generated.inc
          .include models/BC341_user.lib
          .include models/BC361_user.lib
          .subckt RC4558_SECTION P M VP VN OUT
          XU P M VP VN OUT RC4558
          .ends
          """
          # Audit corrected bootstrap junction revision, after default timing selection.
          rows=[]
          # Run DC bias separately before any clipping transient, so failures cannot hide it.
          dc=out/'dc.cir'
          dc.write_text(prefix+'\nVIN AUDIO_OUT 0 0\n'+stage+'\n.control\nop\nprint v(driver_in) v(drvm) v(drv) v(out_internal) v(out_plus) v(basep) v(basen) v(ep) v(en) i(vcp) i(vcn)\nquit\n.endc\n.end\n')
          d=subprocess.run(['ngspice','-b',str(dc)],capture_output=True,text=True)
          print('DC_BIAS',d.stdout,d.stderr,flush=True)
          for freq in [1000,100,10000]:
              for level in [0,18,-30,12,21]:
                  peak=np.sqrt(2)*10**(level/20)/2
                  name=f'{freq}_{level}';raw=out/(name+'.tsv');deck=out/(name+'.cir')
                  template=(prefix+f'\nVIN AUDIO_OUT 0 SIN(0 {peak} {freq})\n'+stage+f"""
          .options reltol=1e-7 abstol=1e-13 vntol=1e-9
          .control
          set wr_singlescale
          set wr_vecnames
          tran 1u .8 .7 1u
          wrdata {raw} v(audio_out) v(drv) v(out_plus) v(basep) v(basen) v(ep) v(en) i(vcp) i(vcn)
          quit
          .endc
          .end
          """)
                  for attempt,(tol,step,method) in enumerate([('1e-7','1u','trap'),('1e-5','.5u','gear'),('1e-6','.25u','gear')]):
                      raw.unlink(missing_ok=True)
                      deck.write_text(template.replace('reltol=1e-7',f'reltol={tol} method={method}').replace('tran 1u .8 .7 1u',f'tran {step} .8 .7 {step}'))
                      logpath=out/(name+f'_attempt{attempt}.log')
                      with logpath.open('w') as l:subprocess.run(['ngspice','-b',str(deck)],stdout=l,stderr=subprocess.STDOUT)
                      if raw.exists():
                          a=np.loadtxt(raw,skiprows=1)
                          if a.ndim==2 and a[-1,0]>.79999:break
                      print('SOLVER_RETRY',name,logpath.read_text()[-2000:],flush=True)
                  else:
                      print('FAILED_POINT',name,flush=True);continue
                  t=a[:,0];y=a[:,1:];w=np.sqrt(np.gradient(t));ph=2*np.pi*freq*t
                  X=np.column_stack([np.ones(len(t))]+[v for k in range(1,21) for v in (np.cos(k*ph),np.sin(k*ph))])
                  b=np.linalg.lstsq(X*w[:,None],y*w[:,None],rcond=None)[0];h=np.hypot(b[1::2],b[2::2])
                  row=dict(freq=freq,nominal_output_dBV=level,load=int(os.environ['LOAD']),output_rms=h[0,2]/np.sqrt(2),output_DC=b[0,2],gain_dB=20*np.log10(h[0,2]/h[0,0]),THD_percent=100*np.linalg.norm(h[1:,2])/h[0,2],driver_THD_percent=100*np.linalg.norm(h[1:,1])/max(h[0,1],1e-30),mean_NPN_A=b[0,7],mean_PNP_A=-b[0,8],peak_NPN_A=np.max(y[:,7]),peak_PNP_A=np.max(-y[:,8]),min_NPN_VCE=24-np.max(y[:,5]),min_PNP_VEC=24+np.min(y[:,6]),peak_driver_V=np.max(abs(y[:,1])))
                  row.update({f'K{k}_dBc':20*np.log10(max(h[k-1,2]/h[0,2],1e-30)) for k in range(2,21)})
                  print('OUTPUT',row,flush=True);rows.append(row);raw.unlink()
          deck=out/'impedance.cir';raw=out/'impedance.tsv'
          deck.write_text(prefix+'\nVIN AUDIO_OUT 0 0\n'+stage+'\nIIN 0 OUT_PLUS DC 0 AC 1\n.control\nset wr_singlescale\nset wr_vecnames\nop\nprint v(driver_in) v(drvm) v(drv) v(out_internal) v(out_plus) v(basep) v(basen) v(ep) v(en) i(vcp) i(vcn)\nac dec 10 20 20000\nwrdata '+str(raw)+' mag(v(out_plus))\nquit\n.endc\n.end\n')
          with (out/'impedance.log').open('w') as l:subprocess.run(['ngspice','-b',str(deck)],stdout=l,stderr=subprocess.STDOUT,check=True)
          print((out/'impedance.log').read_text(),flush=True)
          z=np.loadtxt(raw,skiprows=1);print('LOADED_OUTPUT_IMPEDANCE_1KHZ_OHM',float(np.interp(1000,z[:,0],z[:,1])),flush=True)
          with (out/'summary.csv').open('w') as f:
              w=csv.DictWriter(f,fieldnames=rows[0]);w.writeheader();w.writerows(rows)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-audit-${{ matrix.load }}
          path: circuit/output_audit/
