name: Native DLL input level timing sweep
on:
  push:
    branches: [measurement-20-30db]
    paths: [.github/workflows/native-level-sweep.yml]
jobs:
  timing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 160-MKII-0.1-Windows-x64-VST3-Native-160VU-Faceplate
          run-id: 43870592650
          github-token: ${{ github.token }}
          path: existing
      - name: Measure shipped native DLL
        shell: pwsh
        run: |
          @'
          import ctypes as c, pathlib, math
          class Controls(c.Structure):
              _fields_=[('threshold',c.c_float),('ratio',c.c_float),('makeup',c.c_float)]
          P=c.c_void_p
          F=c.CFUNCTYPE
          class API(c.Structure):
              _fields_=[('version',c.c_uint32),('latency',c.c_int),('create',F(P)),('destroy',F(None,P)),('prepare',F(c.c_int,P,c.c_double,c.c_int,c.c_int)),('stop',F(None,P)),('process',F(c.c_int,P,c.POINTER(c.POINTER(c.c_float)),c.c_int,c.POINTER(Controls),c.c_int,c.c_int)),('failed',F(c.c_uint,P))]
          dll=c.CDLL(str(next(pathlib.Path('existing').rglob('160-native.dll')).resolve()))
          dll.mkii_native_api.restype=c.POINTER(API)
          a=dll.mkii_native_api().contents
          assert a.version==3
          import statistics as st
          rate=44100; block=441; delay=1024
          # 1 V differential peak, same as reference test.
          high=1/13.790836925122916
          low=high*.01
          def run(threshold,ratio=4):
              obj=a.create(); assert a.prepare(obj,rate,1,512)
              settings=Controls(threshold,ratio,0)
              result=[]
              for b in range(220):
                  amp=low if b<60 or b>=120 else high
                  arr=(c.c_float*block)(*[amp*math.sin(2*math.pi*1000*(b*block+n)/rate) for n in range(block)])
                  pp=(c.POINTER(c.c_float)*1)(arr)
                  assert a.process(obj,pp,block,c.byref(settings),1,0)
                  result.extend(arr)
              failed=a.failed(obj); a.destroy(obj)
              assert failed==0,failed
              # Align reported fixed pipeline latency, coherent 10-cycle windows for plateau.
              result=result[delay:]
              env=[]
              for k in range(1,2100):
                  n=round(k*rate/1000); m=round((k+1)*rate/1000)
                  t=(n+m)/2/rate
                  amp=high if .6<=t<1.2 else low
                  v=result[n:m]
                  I=sum(y*math.sin(2*math.pi*1000*(n+i)/rate) for i,y in enumerate(v))
                  Q=sum(y*math.cos(2*math.pi*1000*(n+i)/rate) for i,y in enumerate(v))
                  env.append((t,20*math.log10(max(2*math.hypot(I,Q)/len(v)/amp,1e-15))))
              return env
          for dbu in (-8, -4, 0, 4, 8, 12, 16, 20):
              peakvolts=.775*10**(dbu/20)*math.sqrt(2)
              high=peakvolts/13.790836925122916
              low=high*.01
              # Ratio 1 baseline removes coupling/filter transients from step envelope.
              base=run(.2,1)
              for target in (10,20,30):
                  th=.70710678*peakvolts*10**(-target/15)
                  for trial in range(5):
                      th=max(.01,min(3,th))
                      env=run(th)
                      grenv=[(t,b-v) for (t,v),(_,b) in zip(env,base)]
                      zero=st.median(v for t,v in grenv if .4<t<.55)
                      g=[(t,v-zero) for t,v in grenv]
                      gr=st.median(v for t,v in g if 1.05<t<1.15)
                      print('CAL',target,th,gr,flush=True)
                      if abs(gr-target)<.3 or (th==.01 and gr<target):break
                      th*=10**((gr-target)/15)
                  def cross(begin,end,value,up):
                      q=[(t,v) for t,v in g if begin<=t<end]
                      for (t0,v0),(t1,v1) in zip(q,q[1:]):
                          if (v0<value<=v1 if up else v0>value>=v1):
                              return 1000*(t0+(t1-t0)*(value-v0)/(v1-v0)-begin)
                      return float('nan')
                  r=[(t,v) for t,v in g if t>1.2 and .2*gr<v<.8*gr]
                  mt=st.mean(t for t,v in r) if r else 0
                  mv=st.mean(v for t,v in r) if r else 0
                  slope=-sum((t-mt)*(v-mv) for t,v in r)/max(1e-20,sum((t-mt)**2 for t,v in r))
                  print('RESULT input_dBu',dbu,'target',target,'actual_GR',gr,'threshold',th,'attack_ms',cross(.6,1.2,.632*gr,True),'release63_ms',cross(1.2,2.1,.368*gr,False),'recovery_slope_dB_s',slope,flush=True)
          '@ | Set-Content timing.py
          python timing.py
permissions:
  actions: read
  contents: read
