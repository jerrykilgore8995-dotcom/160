name: THAT2181B datasheet measurements
on:
  workflow_dispatch:
  push:
    paths:
      - circuit/measure_vca_datasheet.py
      - .github/workflows/vca-datasheet.yml
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice python3-numpy
          curl -fL --retry 3 https://www.ti.com/lit/zip/sloj053 -o ti.zip
          curl -fL --retry 3 https://thatcorp.com/wp-content/uploads/2020/11/THATMacroModels-Rev05.zip -o that.zip
          unzip -j -o ti.zip RC4558.301 -d circuit
          unzip -j -o that.zip 2181_Macro_01.lib -d circuit
          python3 circuit/measure_vca_datasheet.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vca-datasheet-measurements
          path: circuit/vca_datasheet/
